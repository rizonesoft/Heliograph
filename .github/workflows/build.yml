name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tools: ~\AppData\Local\ImpossibleSDK
          - os: ubuntu-latest
            tools: ~/.cache/impossible-sdk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: Heliograph
      - name: The pinned SDK commit
        id: sdk
        shell: bash
        run: echo "commit=$(python -c 'import json; print(json.load(open("Heliograph/sdk.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rizonesoft/ImpossibleSDK
          ref: ${{ steps.sdk.outputs.commit }}
          path: ImpossibleSDK
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.tools }}
          key: tools-${{ matrix.os }}-${{ hashFiles('ImpossibleSDK/toolchain.json') }}
      - name: A C23 compiler for the Linux program
        if: runner.os == 'Linux'
        run: |
          if ! echo 'int x;' | cc -std=gnu23 -x c -c -o /dev/null - 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gcc-14
            sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100
            sudo update-alternatives --set cc /usr/bin/gcc-14
          fi
      - name: Install the pinned toolchain
        run: python ImpossibleSDK/tools/bootstrap.py
      - name: Build and test
        run: python ImpossibleSDK/tools/app_build.py Heliograph
      - name: Work list
        working-directory: Heliograph
        run: |
          python scripts/todo-graph.py validate --all
          python scripts/todo-graph.py plan --check
